    dataset: GSE111603
    path: "{multiome_root}/../04_bulk_rnaseq/GSE111603"
    sample_column_regex: "^R4con\\d+_S\\d+$"
  - sample_id: GSE111603_R4FK
    dataset: GSE111603
    path: "{multiome_root}/../04_bulk_rnaseq/GSE111603"
    sample_column_regex: "^R4FK\\d+_S\\d+$"
  - sample_id: GSE111603_WTcon
    dataset: GSE111603
