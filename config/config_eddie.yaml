# ---------------------------------------------------------------------------
# held_out_inputs — Module 9 POSITIVE checks only. Physically read-only on
# disk (chmod 555 by download_datasets.sh Section 6) — do not reference this
# block from any rule file except 09_validation.smk.
# ---------------------------------------------------------------------------
held_out_inputs:
  - sample_id: GSE224627_GAP_reprogramming
    dataset: GSE224627
    path: "{multiome_root}/../06_held_out/GSE224627_GAP_reprogramming"
    check: atoh1_gfi1_pou4f3_overexpression
    # GSE224627_Exon_UMI_matrix.txt.gz carries a real gene_symbol column
    # separate from its row index — confirmed via loader log (dtype-coercion
    # dropped=['gene_symbol'], correctly, since it's non-numeric). Without
    # this override var_names fell back to the raw index (a different
    # identifier space than TG_pseudobulk.tsv's gene-symbol index), giving
    # an empty gene intersection (real_shift: 0 genes) and a hard FAIL with
    # no computed statistics at all.
    symbol_column: gene_symbol
  - sample_id: GSE233559_Tbx2_OHC_IHC
    dataset: GSE233559
    path: "{multiome_root}/../06_held_out/GSE233559_Tbx2_OHC_IHC"
    check: tbx2_conversion
  # FIXED 2026-09-26 (Bug Class A) — this is the plan doc's designated
  # aging ground truth: everything else in Module 9's aging checks is
  # scored against its shift. Real directory holds 7 files: 3M/12M/24M/
  # 24M_BU x Cochlea, and 3M/12M/24M x Utricle. Previously loaded with no
  # format/glob_pattern at all, so _find_one's old silent-first-file bug
  # picked ONE of the 7 (the youngest, 3M_Cochlea) — "the aging vector"
  # never contained any aged tissue. Fixed in two steps: (1) restricted to
  # Cochlea (Utricle is vestibular, not cochlear — same call as
  # GSE283534/GSE168041 above), (2) rather than merging all 4 real Cochlea
  # ages into one blended mean (trading the silent-drop bug for a Bug
  # Class A blend), split into a 24M target (the "aged" state, averaging
  # its 2 real reps incl. the _BU replicate) and a paired_baseline_entry
  # at 3M (the study's own "young" reference) — a genuine within-study
  # old-vs-young contrast instead of either a silent drop or a multi-age
  # blend. 12M is left out of the primary vector (a real intermediate
  # timepoint, but folding it in means a 3-point trend rather than a
  # shift — a bigger redesign than fixing the blending bug; revisit if a
  # dose-response aging check is wanted later).
  - sample_id: GSE274279_aging_snRNAseq
    dataset: GSE274279
    path: "{multiome_root}/../06_held_out/GSE274279_aging_snRNAseq"
    check: aging_vector
    format: mtx_trio_merge
    glob_pattern: "GSM*_24M_Cochlea*_matrix.mtx.gz"
    paired_baseline_entry:
      sample_id: GSE274279_3M_Cochlea
      dataset: GSE274279
      path: "{multiome_root}/../06_held_out/GSE274279_aging_snRNAseq"
      format: mtx_trio_merge
      glob_pattern: "GSM*_3M_Cochlea_matrix.mtx.gz"
  # FIXED 2026-09-26 (Bug Class A) — real columns confirmed: 9m_IHCs(4) /
  # 9m_OHCs(4) / 26m_IHCs(4) / 26m_OHCs(4) — 2 real ages x 2 real hair-cell
  # types (inner/outer), previously all 16 loaded and blended into one
  # mean. IHC and OHC are genuinely different cell types (shouldn't be
  # pooled even before considering age), so split by cell type FIRST, then
  # each becomes its own 26m-vs-9m paired within-study aging check —
  # mirrors GSE274279's design above rather than picking one cell type.
  - sample_id: GSE153882_IHC_aging
    dataset: GSE153882
    path: "{multiome_root}/../06_held_out/GSE153882_hc_aging"
    check: aging_vector_support
    sample_column_regex: "^26m_IHCs_\\d+ RPKM value$"
    paired_baseline_entry:
      sample_id: GSE153882_IHC_baseline
      dataset: GSE153882
      path: "{multiome_root}/../06_held_out/GSE153882_hc_aging"
      sample_column_regex: "^9m_IHCs_\\d+ RPKM value$"
  - sample_id: GSE153882_OHC_aging
    dataset: GSE153882
    path: "{multiome_root}/../06_held_out/GSE153882_hc_aging"
    check: aging_vector_support
    sample_column_regex: "^26m_OHCs_\\d+ RPKM value$"
    paired_baseline_entry:
      sample_id: GSE153882_OHC_baseline
      dataset: GSE153882
      path: "{multiome_root}/../06_held_out/GSE153882_hc_aging"
      sample_column_regex: "^9m_OHCs_\\d+ RPKM value$"
  # FIXED 2026-09-26 (Bug Class A) — 1mo/9mo/26mo (3 reps each) were one
  # blended mean across 3 real ages. Split into a 26mo target ("aged")
  # with a paired_baseline_entry at 1mo ("young"); 9mo left out of the
  # primary check for the same reason as GSE274279's 12M above. Both
  # sub-entries keep the pre-existing excel/sheet_name fix (workbook's
  # sheet 0 is a README tab, not the data).
  - sample_id: GSE154833_stria_aging
    dataset: GSE154833
    path: "{multiome_root}/../06_held_out/GSE154833_stria_aging"
    check: aging_vector_support
    format: excel
    sheet_name: "All values"
    sample_column_regex: "^26mo_SV_[A-Z]$"
    paired_baseline_entry:
      sample_id: GSE154833_stria_baseline
      dataset: GSE154833
      path: "{multiome_root}/../06_held_out/GSE154833_stria_aging"
      format: excel
      sheet_name: "All values"
      sample_column_regex: "^1mo_SV_[A-Z]$"
  # FIXED 2026-09-26 (Bug Class A) — real columns confirmed: this dataset
  # blends TWO UNRELATED EXPERIMENTS. MUS/MUS_8M/MUS_12M (4 reps each) is
  # a real aging series; PN_1h/PN_24h/PC_1d/PC_3d (4/4/4/3 reps) is a
  # separate noise- or chemical-injury time course that has nothing to do
  # with aging. Previously all 27 columns were loaded and blended into one
  # mean, which mixed an acute-injury signal into "the aging shift". Fixed
  # by restricting to the MUS series only (glob equivalent via
  # sample_column_regex, since this is a single-matrix-file entry) and
