  # question. All 5 now resolved (GSE127683 confirmed 2026-09-28 via manual
  # GEO lookup) — none added live.

# ---------------------------------------------------------------------------
# held_out_inputs — Module 9 POSITIVE checks only. Physically read-only on
# disk (chmod 555 by download_datasets.sh Section 6) — do not reference this
# block from any rule file except 09_validation.smk.
# ---------------------------------------------------------------------------
held_out_inputs:
  - sample_id: GSE224627_GAP_reprogramming
    dataset: GSE224627
    path: "{multiome_root}/../06_held_out/GSE224627_GAP_reprogramming"
    check: atoh1_gfi1_pou4f3_overexpression
    # GSE224627_Exon_UMI_matrix.txt.gz carries a real gene_symbol column
    # separate from its row index — confirmed via loader log (dtype-coercion
    # dropped=['gene_symbol'], correctly, since it's non-numeric). Without
    # this override var_names fell back to the raw index (a different
    # identifier space than TG_pseudobulk.tsv's gene-symbol index), giving
    # an empty gene intersection (real_shift: 0 genes) and a hard FAIL with
    # no computed statistics at all.
    symbol_column: gene_symbol
  - sample_id: GSE233559_Tbx2_OHC_IHC
    dataset: GSE233559
    path: "{multiome_root}/../06_held_out/GSE233559_Tbx2_OHC_IHC"
    check: tbx2_conversion
  # FIXED 2026-09-26 (Bug Class A) — this is the plan doc's designated
  # aging ground truth: everything else in Module 9's aging checks is
  # scored against its shift. Real directory holds 7 files: 3M/12M/24M/
  # 24M_BU x Cochlea, and 3M/12M/24M x Utricle. Previously loaded with no
  # format/glob_pattern at all, so _find_one's old silent-first-file bug
  # picked ONE of the 7 (the youngest, 3M_Cochlea) — "the aging vector"
  # never contained any aged tissue. Fixed in two steps: (1) restricted to
  # Cochlea (Utricle is vestibular, not cochlear — same call as
  # GSE283534/GSE168041 above), (2) rather than merging all 4 real Cochlea
  # ages into one blended mean (trading the silent-drop bug for a Bug
  # Class A blend), split into a 24M target (the "aged" state, averaging
  # its 2 real reps incl. the _BU replicate) and a paired_baseline_entry
  # at 3M (the study's own "young" reference) — a genuine within-study
  # old-vs-young contrast instead of either a silent drop or a multi-age
  # blend. 12M is left out of the primary vector (a real intermediate
  # timepoint, but folding it in means a 3-point trend rather than a
  # shift — a bigger redesign than fixing the blending bug; revisit if a
  # dose-response aging check is wanted later).
  - sample_id: GSE274279_aging_snRNAseq
    dataset: GSE274279
    path: "{multiome_root}/../06_held_out/GSE274279_aging_snRNAseq"
    check: aging_vector
    format: mtx_trio_merge
    glob_pattern: "GSM*_24M_Cochlea*_matrix.mtx.gz"
    paired_baseline_entry:
      sample_id: GSE274279_3M_Cochlea
      dataset: GSE274279
      path: "{multiome_root}/../06_held_out/GSE274279_aging_snRNAseq"
      format: mtx_trio_merge
      glob_pattern: "GSM*_3M_Cochlea_matrix.mtx.gz"
  # FIXED 2026-09-26 (Bug Class A) — real columns confirmed: 9m_IHCs(4) /
  # 9m_OHCs(4) / 26m_IHCs(4) / 26m_OHCs(4) — 2 real ages x 2 real hair-cell
  # types (inner/outer), previously all 16 loaded and blended into one
  # mean. IHC and OHC are genuinely different cell types (shouldn't be
  # pooled even before considering age), so split by cell type FIRST, then
  # each becomes its own 26m-vs-9m paired within-study aging check —
  # mirrors GSE274279's design above rather than picking one cell type.
  - sample_id: GSE153882_IHC_aging
    dataset: GSE153882
    path: "{multiome_root}/../06_held_out/GSE153882_hc_aging"
    check: aging_vector_support
    sample_column_regex: "^26m_IHCs_\\d+ RPKM value$"
    paired_baseline_entry:
      sample_id: GSE153882_IHC_baseline
      dataset: GSE153882
      path: "{multiome_root}/../06_held_out/GSE153882_hc_aging"
      sample_column_regex: "^9m_IHCs_\\d+ RPKM value$"
  - sample_id: GSE153882_OHC_aging
    dataset: GSE153882
    path: "{multiome_root}/../06_held_out/GSE153882_hc_aging"
    check: aging_vector_support
    sample_column_regex: "^26m_OHCs_\\d+ RPKM value$"
    paired_baseline_entry:
      sample_id: GSE153882_OHC_baseline
      dataset: GSE153882
      path: "{multiome_root}/../06_held_out/GSE153882_hc_aging"
      sample_column_regex: "^9m_OHCs_\\d+ RPKM value$"
  # FIXED 2026-09-26 (Bug Class A) — 1mo/9mo/26mo (3 reps each) were one
  # blended mean across 3 real ages. Split into a 26mo target ("aged")
  # with a paired_baseline_entry at 1mo ("young"); 9mo left out of the
  # primary check for the same reason as GSE274279's 12M above. Both
  # sub-entries keep the pre-existing excel/sheet_name fix (workbook's
  # sheet 0 is a README tab, not the data).
  - sample_id: GSE154833_stria_aging
    dataset: GSE154833
    path: "{multiome_root}/../06_held_out/GSE154833_stria_aging"
    check: aging_vector_support
    format: excel
    sheet_name: "All values"
    sample_column_regex: "^26mo_SV_[A-Z]$"
    paired_baseline_entry:
      sample_id: GSE154833_stria_baseline
      dataset: GSE154833
      path: "{multiome_root}/../06_held_out/GSE154833_stria_aging"
      format: excel
      sheet_name: "All values"
      sample_column_regex: "^1mo_SV_[A-Z]$"
  # FIXED 2026-09-26 (Bug Class A) — real columns confirmed: this dataset
  # blends TWO UNRELATED EXPERIMENTS. MUS/MUS_8M/MUS_12M (4 reps each) is
  # a real aging series; PN_1h/PN_24h/PC_1d/PC_3d (4/4/4/3 reps) is a
  # separate noise- or chemical-injury time course that has nothing to do
  # with aging. Previously all 27 columns were loaded and blended into one
  # mean, which mixed an acute-injury signal into "the aging shift". Fixed
  # by restricting to the MUS series only (glob equivalent via
  # sample_column_regex, since this is a single-matrix-file entry) and
  # splitting into a MUS_12M target ("aged") vs a paired_baseline_entry at
  # MUS ("young/unperturbed" baseline of this same series). MUS_8M left
  # out of the primary check for the same reason as the other datasets'
  # intermediate timepoints above; PN_*/PC_* dropped entirely — an acute
  # injury time-course doesn't belong in an aging validation regardless of
  # how the blending bug gets fixed.
  - sample_id: GSE196870_SNHL
    dataset: GSE196870
    path: "{multiome_root}/../06_held_out/GSE196870_SNHL"
    check: aging_vector_support
    symbol_column: gene
    sample_column_regex: "^MUS_12M_\\d+$"
    paired_baseline_entry:
      sample_id: GSE196870_MUS_baseline
      dataset: GSE196870
      path: "{multiome_root}/../06_held_out/GSE196870_SNHL"
      symbol_column: gene
      sample_column_regex: "^MUS_\\d+$"
  # EXCLUDED 2026-09-26 (Bug Class A, unresolved) — real columns confirmed:
  # Ele_M1-4 / Thr_M1-4 / Twe_M1-4 (12 real per-replicate columns) plus a
  # stray `gene_Dbxref` annotation column (previously numeric-coerced and
  # averaged in as a 13th "sample" — that part IS fixable, see
  # exclude_columns below). But whether Ele/Thr/Twe are 3 distinct
  # treatment conditions (still blended if averaged) or 3 organoid line/
  # donor IDs under one shared protocol (fine to average) was not
  # confirmed from the data available here. Rather than guess and risk
  # repeating the exact bug this whole fix pass exists to close, this
  # entry is commented out of aging_vector_support until that's resolved.
  # To re-enable: uncomment, and if Ele/Thr/Twe are real conditions, split
  # it the same way as the entries above (pick one arm as target, another
  # as paired_baseline_entry, or add a 3rd check per arm).
  # - sample_id: GSE273939_TNF_organoids
  #   dataset: GSE273939
  #   path: "{multiome_root}/../06_held_out/GSE273939_TNF_organoids"
  #   check: aging_vector_support
  #   exclude_columns: [gene_Dbxref]

# ---------------------------------------------------------------------------
# negative_control_input — Module 9 NEGATIVE check only, kept in its own
# block (not merged into held_out_inputs) per 2026-07-24 decision: must be
# scored with an inverted pass/fail (should NOT reprogram).
# ---------------------------------------------------------------------------
negative_control_input:
  sample_id: GSE281207_Tmie_KO
  dataset: GSE281207
  path: "{multiome_root}/../07_negative_control/GSE281207_Tmie_control"
  check: negative_control_must_not_reprogram
  # Directory holds 7 sibling per-sample CellRanger .h5 files — P21-HET-A/B/C/F
  # (4 real HET replicates) and P21-KO-B/E/F (3 real KO replicates);
  # CellRanger 7.0.0, Single Cell 3' v3 — confirmed via h5py — plus
  # filelist.txt (a GEO manifest) and GSE281207_RAW.tar. Auto-detect
  # previously matched filelist.txt via _load_single_matrix_file's bare
  # "*.txt" glob before ever considering the real .h5 files.
  #
  # FIXED 2026-09-26 (Bug Class A) — this entry's glob_pattern used to be
  # "GSM*_P21-*.h5", loading ALL 7 HET+KO files as one blended pseudobulk
  # mean (n_files=7) before ever comparing to a baseline: the exact
  # genotype contrast this negative control exists to isolate was averaged
  # away before the check ever ran. Restricted to the 3 real KO replicates
  # only; paired_baseline_entry below loads this SAME study's 4 real HET
  # replicates as the within-study control (see validate_held_out.py's
  # --baseline-entry-json / 09_validation.smk's paired_baseline_entry
  # wiring) instead of diffing against the cross-study Module 4 population
  # baseline, so real_shift is free of both the blending bug and an
  # unnecessary cross-study batch confound.
  format: cellranger_h5_merge
  glob_pattern: "GSM*_P21-KO-*.h5"
  paired_baseline_entry:
    sample_id: GSE281207_Tmie_HET
    dataset: GSE281207
    path: "{multiome_root}/../07_negative_control/GSE281207_Tmie_control"
    format: cellranger_h5_merge
    glob_pattern: "GSM*_P21-HET-*.h5"

# ---------------------------------------------------------------------------
# generalization_test_panel — NEW 2026-09-27, not in the original 7-category
# schema documented in LINGER_datasets.docx. Deliberately its own top-level
# block, not merged into held_out_inputs: held_out_inputs checks whether the
# model reproduces a KNOWN reprogramming/aging result for the TFs it was
# specifically built around (Atoh1/Gfi1/Pou4f3/Tbx2); this checks whether the
# trained GRN GENERALIZES to TFs it was never specifically built to knock
# out. Different question, different pass/fail semantics (beats a baseline —
# no-change / matched-mean / ridge — not "matches a frozen known direction"),
# so a different block. Source: Cochlea-model-testing-set-2.xlsx, whose own
# 7 test dimensions are carried through as `test_dimensions` below (①
# perturbation accuracy, ② unseen-gene generalization, ③ combinatorial, ④
# dynamic identity, ⑤ cross-cell-type transfer, ⑥ known-factor ranking, ⑦
# prospective blind).
#
# ALL 8 ENTRIES ARE PENDING two checks before any of this feeds Module 8/9:
#   1. other_helper_scripts/check_tf_eligibility.py — is `gene` actually a
#      row in Exp.tsv (real TF, present in this pipeline's trained network)?
#      Only Pknox2/Casz1/Zbtb20/Prdm16 are expected to pass based on known
#      biology (homeodomain/zinc-finger TFs); Notch1/Ctnnb1 (entry 8) are the
#      open question this check is FOR, not a foregone conclusion either way
#      — see check_tf_eligibility.py's docstring.
#   2. other_helper_scripts/audit_condition_mixing.py Stage B — path/format/
#      glob_pattern below are placeholders pointing at where
#      download_datasets.sh Section 10 puts each download; they have NOT
#      been checked against the real files yet the way every entry in
#      extra_bulk_rna_inputs above has (see this file's many "FIXED
#      2026-09-26 (Bug Class A)" comments — assume every one of these needs
#      the same scrutiny before its mean/pseudobulk is trusted).
#
# SCOPE: 13 of the xlsx panel's 21 datasets are deliberately excluded here —
# see download_datasets.sh Section 10's header comment for the full
# breakdown (5 microarray + 1 BioProject accession dropped from scope; 7
# datasets dropped because their gene is not a DNA-binding TF).
# ---------------------------------------------------------------------------
generalization_test_panel:
  # FIXED 2026-09-28 (Bug Class A) — extracted the RAW.tar: real folder has
  # 6 real GSM samples across 3 DIFFERENT ages (P26 x3, P33 x2, P12 x2 —
  # that's 7 counted, actually P33 has 2 OE reps + 1 separate P33 control =
  # 3 P33 samples total), confirming the notes' suspicion: the download
  # does pull other timepoints/arms. Only GSM5261977/78 (cHCsP33_1/2 —
  # tamoxifen-induced Atoh1-OE, P33) and GSM5261981 (cochlear_P33 — P33
  # control, no induction) are this test's real units; P26 (x3) and P12
  # (x2) samples are a different experiment's timepoints and must NOT be
  # pulled in. Old CellRanger 2.x-style mtx trio (genes.tsv.gz, not
  # features.tsv.gz) — loader supports both names. glob_pattern uses a
  # character class on the last GSM digit (977 vs 978) to grab exactly the
  # 2 real OE reps without touching any P26/P12 file.
  - test_id: GSE173217_Atoh1_OE_P33
    dataset: GSE173217
    gene: Atoh1
    direction: OE
    perturbation_mode: grn_row_boost   # NEW Module 8 mode — see linger_perturbation.py plan; not yet implemented
    test_dimensions: ["1", "4", "6"]   # perturbation accuracy; dynamic identity; known-factor ranking
    age: P33
    path: "{multiome_root}/../10_generalization_test/GSE173217_Atoh1_OE_P33"
    format: mtx_trio_merge
    glob_pattern: "GSM526197[78]_cHCsP33_*_matrix.mtx.gz"
    paired_baseline_entry:
      test_id: GSE173217_Atoh1_control_P33
      dataset: GSE173217
      path: "{multiome_root}/../10_generalization_test/GSE173217_Atoh1_OE_P33"
      format: mtx_trio_merge
      glob_pattern: "GSM5261981_cochlear_P33_matrix.mtx.gz"   # single real replicate, n=1
    eligibility: pending_check_tf_eligibility   # expected ELIGIBLE — Atoh1 already in perturbation.knockouts
    notes: >-
      P12-P13 tamoxifen induction, P33 endpoint. Control arm (GSM5261981)
      is n=1 — a real limitation of this dataset, not a loader bug; treat
      any variance/CI estimate on the control side accordingly. GSM5261979/
      80 (P12) and GSM5261974/75/76 (P26) are a separate experiment in the
      same GSE and are deliberately excluded by glob_pattern, not merged.

  # FIXED 2026-09-28 (Bug Class A, caught by audit_condition_mixing.py Stage
  # B on first pass) — real file has 10 sample columns: KO_1..5, WT_1..5 (a
  # clean, evenly-replicated within-study KO-vs-WT design; obs_names/
  # prefix_clusters confirmed this exactly). Previously loaded with no
  # sample_column_regex, so both arms were blended into one mean. Split via
  # sample_column_regex; WT moved into paired_baseline_entry (same
  # convention as GSE274279/GSE153882/GSE154833 in held_out_inputs above),
  # since a generalization-panel KO test is only interpretable against its
  # own study's real WT, not some other dataset's baseline.
  - test_id: GSE171921_Pknox2_KO_P8
    dataset: GSE171921
    gene: Pknox2
    direction: KO
    perturbation_mode: grn_row_zero
    test_dimensions: ["1", "2"]        # perturbation accuracy; unseen-gene generalization
    age: P8
    path: "{multiome_root}/../10_generalization_test/GSE171921_Pknox2_KO_P8"
    sample_column_regex: "^KO_\\d+$"
    paired_baseline_entry:
      test_id: GSE171921_Pknox2_WT_P8
      dataset: GSE171921
      path: "{multiome_root}/../10_generalization_test/GSE171921_Pknox2_KO_P8"
      sample_column_regex: "^WT_\\d+$"
    eligibility: pending_check_tf_eligibility

  # FIXED 2026-09-28 (Bug Class A) — header confirmed via zcat: columns are
  # Geneid, WT1..WT5, cKO1..cKO5 — a clean 5v5 blend in
  # GSE300215_FeatureCounts.txt.gz (glob_pattern already excludes the
  # sibling GSE300215_edgeR_Casz1cKOvsWT.txt.gz DE-stats file). Split via
  # sample_column_regex; WT moved into paired_baseline_entry, same
  # convention as GSE171921/GSE279618/GSE199369 above. `Geneid` is the row
  # index, not a sample column, so it's untouched by either regex.
  - test_id: GSE300215_Casz1_cKO_P4
    dataset: GSE300215
    gene: Casz1
    direction: cKO
    perturbation_mode: grn_row_zero
    test_dimensions: ["1", "2"]
    age: P4
    path: "{multiome_root}/../10_generalization_test/GSE300215_Casz1_cKO_P4"
    glob_pattern: "GSE300215_FeatureCounts.txt.gz"   # excludes the edgeR DE-stats sibling file
    sample_column_regex: "^cKO\\d+$"
    paired_baseline_entry:
      test_id: GSE300215_Casz1_WT_P4
      dataset: GSE300215
      path: "{multiome_root}/../10_generalization_test/GSE300215_Casz1_cKO_P4"
      glob_pattern: "GSE300215_FeatureCounts.txt.gz"
      sample_column_regex: "^WT\\d+$"
    eligibility: pending_check_tf_eligibility
    notes: >-
      Geneid values in the real header (e.g. 497097, 100503874) look like
      Entrez Gene IDs, not gene symbols — same category of gap already seen
      on GSE135703/GSE266157/GSE116702 (Ensembl/Entrez-only, no symbol
      column). Confirm var_names resolves to something that actually
      overlaps trans_reg.index (gene symbols); if not, this needs a
      symbol_column override or an Entrez->symbol mapping step before
      trusting any computed shift, same as those other entries.

  # FIXED 2026-09-28 (Bug Class A) — real file is single-cell (65 named
  # columns, one per cell, not per-replicate): P10_WT_OHC-1..48 (48 WT OHCs)
  # and "P10_Casz1 CKO OHC-1..17" (17 cKO OHCs — note the real column name
  # has a SPACE before "CKO", not an underscore; regex below matches that
  # literally). Previously blended all 65 into one mean, averaging 48 WT
  # cells straight into the 17 real cKO cells. Split via sample_column_regex;
  # WT moved into paired_baseline_entry, same convention as GSE171921 above.
  - test_id: GSE279618_Casz1_KO_P10
    dataset: GSE279618
    gene: Casz1
    direction: KO
    perturbation_mode: grn_row_zero
    test_dimensions: ["1", "4", "5"]   # + dynamic identity, cross-cell-type transfer
    age: P10
    path: "{multiome_root}/../10_generalization_test/GSE279618_Casz1_KO_P10"
    sample_column_regex: "^P10_Casz1 CKO OHC-\\d+$"
    paired_baseline_entry:
      test_id: GSE279618_Casz1_WT_P10
      dataset: GSE279618
      path: "{multiome_root}/../10_generalization_test/GSE279618_Casz1_KO_P10"
      sample_column_regex: "^P10_WT_OHC-\\d+$"
    eligibility: pending_check_tf_eligibility
    notes: >-
      Second, independent dataset for the same gene as GSE300215 at a
      different age — score separately, do not average the two together
      (different ages, different perturbation type cKO vs KO). Both arms
      are OHC-only (single cell type) — n=48 WT vs n=17 cKO, real cell-level
      replicates, not bulk reps; treat n accordingly in any variance/CI
      calculation (don't assume bulk-style low-n reps).

  # FIXED 2026-09-28 (Bug Class A) — extracted RAW.tar: 10 real per-sample
  # files, one GSM each, NOT a single matrix. Real groups: 5 WT
  # (GSM5862579/80/81 named "WT_1/2/3" + GSM6658616/17 named "WT_4/5", a
  # later-batch top-up) and 5 KO (GSM5862582/83/84 named "ZB20KO_1/2/3" +
  # GSM6658618/19 named confusingly just "KO_4/5" — same real WT-vs-KO
  # design across both upload batches, just inconsistent submitter naming).
  # Real header (zcat'd from GSM5862579_WT_1_expression.txt.gz), 7 tab-
  # separated columns: <garbled bytes>Gene ID / WT_1 FPKM / Other Gene ID /
  # Transcripts / Gene Type / Transcripts Number / WT_1 FPKM — note the
  # value column appears TWICE (same value both times, confirmed from the
  # 2 data rows shown) and the id column's header has non-UTF8 garbage
  # bytes before "Gene ID". `id_column` is deliberately left UNSET here
  # (falls back to index_col=0, same fix pattern as GSE116702's headerless
  # case above) specifically to avoid a literal string match against that
  # garbled header text. `symbol_column: "Other Gene ID"` routes var_names
  # to the real gene SYMBOL (e.g. Klhl1, Hmbox1) instead of the numeric
  # first-column Gene ID (Entrez-style) — same intent as GSE85519's
  # symbol_column fix above. `value_column_index: 0` takes the first of
  # the two identical FPKM columns (position 0 among columns after the id
  # column). Column name itself changes per sibling file (e.g. "WT_2 FPKM",
  # "ZB20KO_1 FPKM") but position 0 is assumed constant across all 10 real
  # files — not independently confirmed for every file, only this one.
  - test_id: GSE196199_Zbtb20_cKO_P10
    dataset: GSE196199
    gene: Zbtb20
    direction: cKO
    perturbation_mode: grn_row_zero
    test_dimensions: ["1", "2"]
    age: P10
    path: "{multiome_root}/../10_generalization_test/GSE196199_Zbtb20_cKO_P10"
    format: per_sample_merge
    glob_pattern: "GSM*_expression.txt.gz"
    exclude_files_regex: "_WT_"          # keeps both real KO naming styles: _ZB20KO_ and _KO_
    value_column_index: 0
    symbol_column: "Other Gene ID"
    encoding: "utf-16"   # FIXED 2026-09-28 — real files are UTF-16 (confirmed via
                          # UnicodeDecodeError: byte 0xff at position 0 = UTF-16 LE
                          # BOM). bulk_rna_loader.py's _load_per_sample_merge and
                          # _smart_open_text now support this field (2026-09-28).
    paired_baseline_entry:
      test_id: GSE196199_Zbtb20_WT_P10
      dataset: GSE196199
      path: "{multiome_root}/../10_generalization_test/GSE196199_Zbtb20_cKO_P10"
      format: per_sample_merge
      glob_pattern: "GSM*_expression.txt.gz"
      exclude_files_regex: "_(ZB20)?KO_"   # drops both real KO naming styles, keeps all 5 real WT
      value_column_index: 0
      symbol_column: "Other Gene ID"
      encoding: "utf-16"
    eligibility: pending_check_tf_eligibility
    notes: >-
      value_column_index/symbol_column confirmed against GSM5862579 only —
      if Stage B's obs_names/shape check comes back odd for any of the
      other 9 files, re-inspect that specific file's header before
      trusting the merge (same "confirm before trusting" convention as
      every other per_sample_merge entry in this file). encoding: utf-16
      assumed constant across all 10 sibling files (only GSM5862579 was
      directly confirmed) — if any sibling file throws a decode error
      under utf-16 too, it may need `latin-1` or a per-file override
      instead.

  # FIXED 2026-09-28 (Bug Class A) — extracted RAW.tar: 9 real per-sample
  # files, 3 genotypes x 3 reps each: WT, Het (heterozygous), Null (full
  # knockout). Primary KO-vs-baseline pair uses Null (the real full
  # knockout, matching this entry's `direction: KO`) vs WT; Het is a real
  # intermediate dosage arm, left commented out rather than merged into
  # either side — same call as GSE199369's P30 reference and GSE274279's
  # 12M timepoint elsewhere in this file (a real group, but a 3-point
  # dose-response redesign rather than a shift, out of scope for this
  # pass). Real header (zcat'd from GSM5772189_Prdm16_WT_1.txt.gz), clean
  # 2 tab-separated columns: "Gene" / "Counts" — a plain, consistently-
  # named HTSeq/featureCounts-style export (no sample name embedded in the
  # column header, unlike GSE196199 above), so a single fixed value_column
  # works across all 9 sibling files.
  - test_id: GSE193046_Prdm16_KO_E14_5
    dataset: GSE193046
    gene: Prdm16
    direction: KO
    perturbation_mode: grn_row_zero
    test_dimensions: ["1", "2"]
    age: "E14.5"
    path: "{multiome_root}/../10_generalization_test/GSE193046_Prdm16_KO_E14_5"
    format: per_sample_merge
    glob_pattern: "GSM*_Prdm16_Null_*.txt.gz"
    id_column: Gene
    value_column: Counts
    paired_baseline_entry:
      test_id: GSE193046_Prdm16_WT_E14_5
      dataset: GSE193046
      path: "{multiome_root}/../10_generalization_test/GSE193046_Prdm16_KO_E14_5"
      format: per_sample_merge
      glob_pattern: "GSM*_Prdm16_WT_*.txt.gz"
      id_column: Gene
      value_column: Counts
    eligibility: pending_check_tf_eligibility
    notes: >-
      "Gene" column holds Ensembl IDs (e.g. ENSMUSG00000000001), not gene
      symbols — same category of gap as GSE135703/GSE266157/GSE300215
      elsewhere in this file. Needs an Ensembl->symbol mapping step (or a
      symbol_column, if one turns out to exist in a fuller header this
      3-line check didn't show) before trusting a gene-space overlap with
      trans_reg.index. id_column/value_column confirmed against
      GSM5772189 only — spot-check at least one Het/Null file's header
      too before trusting the full merge.
  # - test_id: GSE193046_Prdm16_Het_E14_5
  #   dataset: GSE193046
  #   path: "{multiome_root}/../10_generalization_test/GSE193046_Prdm16_KO_E14_5"
  #   format: per_sample_merge
  #   glob_pattern: "GSM*_Prdm16_Het_*.txt.gz"
  #   notes: >-
  #     Real heterozygous dosage arm, n=3. Not part of the primary Null-vs-WT
  #     pair above — kept commented for a possible future dose-response
  #     check (WT/Het/Null), not this check.

  # FIXED 2026-09-28 (Bug Class A) — the `age: P14` tag on this entry was
  # WRONG/incomplete: real file has 151 columns spanning TWO ages and what
  # is actually a cell-identity conversion, not a simple KO-vs-WT: "P14_iOHC-
  # 1..46" (Tbx2-KO IHCs converted toward an OHC-like identity — Tbx2 loss
  # is known to push IHCs to an OHC-like fate, matches deck2's "IHC→OHC-
  # like" dimension-④ framing for this exact GSE), "P14_WT IHC-1..55" (real
  # age-matched WT baseline), and "P30_WT IHC-1..50" (a LATER-age WT
  # reference, not part of the P14 comparison). Blending all 3 into one
  # mean previously washed out the actual iOHC-vs-WT contrast with an
  # unrelated older WT group. Split via sample_column_regex; P14_WT IHC
  # moved into paired_baseline_entry (mirrors GSE171921/GSE279618 above).
  # P30_WT IHC is deliberately left OUT of the primary pair — same call as
  # GSE274279's 12M / GSE154833's 9mo intermediate timepoints in
  # held_out_inputs (a real group, but a 3-point-trend redesign rather than
  # a shift, out of scope for this pass). If a P14-vs-P30 WT maturation
  # trend is wanted later for dimension ④, GSE199369_Tbx2_P30_WT_ref below
  # is commented out and ready to reactivate for that, not for this check.
  - test_id: GSE199369_Tbx2_KO_P14
    dataset: GSE199369
    gene: Tbx2
    direction: KO
    perturbation_mode: grn_row_zero
    test_dimensions: ["1", "4"]
    age: P14
    path: "{multiome_root}/../10_generalization_test/GSE199369_Tbx2_KO_P14"
    sample_column_regex: "^P14_iOHC-\\d+$"
    paired_baseline_entry:
      test_id: GSE199369_Tbx2_WT_IHC_P14
      dataset: GSE199369
      path: "{multiome_root}/../10_generalization_test/GSE199369_Tbx2_KO_P14"
      sample_column_regex: "^P14_WT IHC-\\d+$"
    eligibility: pending_check_tf_eligibility   # expected ELIGIBLE — Tbx2 already in perturbation.knockouts
    notes: >-
      Tbx2 already has a held_out_inputs check (GSE233559, check:
      tbx2_conversion). This is a SEPARATE, independent dataset — keep
      distinct, do not merge into the held_out_inputs entry or average
      the two results. Real design here is a cell-identity conversion
      (IHC->iOHC), not a simple KO-vs-WT expression shift — confirm
      perturbation_mode/scoring logic actually fits before trusting a
      grn_row_zero + shift-magnitude result for this one.
  # - test_id: GSE199369_Tbx2_P30_WT_ref
  #   dataset: GSE199369
  #   path: "{multiome_root}/../10_generalization_test/GSE199369_Tbx2_KO_P14"
  #   sample_column_regex: "^P30_WT IHC-\\d+$"
  #   notes: >-
  #     Later-age WT reference from the same study, real n=50. Not part of
  #     the P14 iOHC-vs-WT pair above — kept commented for a possible future
  #     P14-vs-P30 WT maturation-trend check under dimension 4, not this
  #     check.

  # FIXED 2026-09-28 (Bug Class A + Bug Class C together) — real file
  # confirmed via obs_names/prefix_clusters: it's a DE-results table, not a
  # plain matrix. Columns: control_1-3 (n=3), b-catenin-OE_1-3 (n=3),
  # catenin_log2(fold_change)/catenin_p_value (precomputed stats, not
  # samples), Notch1-KO_1-3 (n=3), notch_log2(fold_change)/notch_p_value,
  # "b-catenin-OE and Notch1-KO"_1-3 (n=3, the double), both_log2(fold_
  # change)/both_p_value. This is exactly the 4-arm design the xlsx source
  # and the notes below already anticipated (control / single-A / single-B /
  # double) — real data confirms it, and the paper's own log2FC/p-value
  # columns must be excluded the same way GSE90821's MVA:/EDGE:/SAM: stat
  # columns are excluded elsewhere in this file (Bug Class C), or they'd be
  # miscounted as 6 extra "samples".
  #
  # `combinatorial_arms` below is a NEW config mechanism — no existing entry
  # in this file has a 4-arm combinatorial design, so
  # audit_condition_mixing.py and the real bulk_rna_loader do NOT understand
  # this key yet. This block documents the real, confirmed structure so the
  # loader/audit code changes (needed before this entry can be re-audited or
  # wired into Module 8/9) have an exact target to implement against — do
  # not expect Stage B to pass on this entry until that loader support
  # exists. sample_column_regex/exclude_columns values below are the
  # per-arm patterns that support should apply.
  - test_id: GSE86204_Notch1_Ctnnb1_combo_P7
    dataset: GSE86204
    gene: [Notch1, Ctnnb1]
    direction: [KO, activation]
    perturbation_mode: PENDING          # depends entirely on check_tf_eligibility.py's verdict
    test_dimensions: ["1", "3", "6"]    # perturbation accuracy; COMBINATORIAL (the panel's only ③ dataset); known-factor ranking
    age: P7
    path: "{multiome_root}/../10_generalization_test/GSE86204_Notch1_Ctnnb1_combo_P7"
    exclude_columns:
      - "catenin_log2(fold_change)"
      - "catenin_p_value"
      - "notch_log2(fold_change)"
      - "notch_p_value"
      - "both_log2(fold_change)"
      - "both_p_value"
    combinatorial_arms:            # NEW mechanism — see comment above; not yet read by any loader
      control:
        sample_column_regex: "^control_\\d+$"
      ctnnb1_activation_only:
        sample_column_regex: "^b-catenin-OE_\\d+$"
      notch1_ko_only:
        sample_column_regex: "^Notch1-KO_\\d+$"
      double_perturbation:
        sample_column_regex: "^b-catenin-OE and Notch1-KO_\\d+$"
    eligibility: pending_check_tf_eligibility
    notes: >-
      PENDING, not confirmed in scope. Notch1/Ctnnb1 are signaling proteins,
      not DNA-binding TFs themselves — check_tf_eligibility.py checks both
      names AND their canonical effectors (Rbpj, Tcf7, Lef1) against
      Exp.tsv. If none are eligible, this entry (and dimension ③
      combinatorial testing entirely, since this is the panel's only
      combinatorial dataset) drops from scope — do not wire into
      perturbation.knockouts before that check returns ELIGIBLE for at
      least one usable gene name. Real data confirms all 4 test units the
      xlsx source implied: single Notch1 KO, single Ctnnb1 activation,
      double perturbation, and — since the paper's own per-arm log2FC vs
      control is already computed in the excluded stat columns — a direct
      epistasis arm (ε_AB = Δ_AB - (Δ_A+Δ_B)) is computable once loader
      support for combinatorial_arms exists, without needing to
      recompute the paper's own single-arm fold-changes from scratch.

# ---------------------------------------------------------------------------
# QC thresholds — starting points, inspect QC plots before trusting on a full run.
# ---------------------------------------------------------------------------
qc_params:
  min_genes_per_cell: 200
  max_pct_mito: 15.0
  min_peaks_per_cell: 500
  min_cells_per_gene: 3
  min_cells_per_peak: 3
  scrublet_expected_doublet_rate: 0.06
  scrublet_random_state: 0
  merge_gap_bp: 0            # bedtools merge -d for consensus peak set
  # Gene-level removal (separate from the max_pct_mito per-CELL gate above,
  # which stays as-is). Added 2026-09-16: strips mito genes and the
  # HB_ERYTHROID_GENES panel (qc_lib.py) from the feature set entirely,
  # applied per-sample in qc_filter_rna() before Module 3's normalization.
  remove_mito_genes: true
  remove_hb_genes: true

# ---------------------------------------------------------------------------
# Module 3 — integration & cell typing
# ---------------------------------------------------------------------------
integration:
  method: harmony             # chosen 2026-07-21
  batch_key: sample_id
  n_hvgs: 3000
  n_pcs: 30
  leiden_resolution: 1.0
  marker_genes:                # cochlear identity markers for annotation support
    hair_cell: [Myo7a, Pou4f3, Gfi1]
    outer_hair_cell: [Slc26a5]     # "Prestin"
    supporting_cell: [Sox2, Hes1]
  cluster_annotation_tsv: "{scratch}/module3_integration/cluster_annotation.tsv"

# ---------------------------------------------------------------------------
# Module 4-8 — LINGER core (GRN inference, TF activity, perturbation)
#
# method='scNN' — chosen because it's the ONLY LINGER training mode that
# supports mouse natively (confirmed against installed LingerGRN==1.110
# source, docs/scNN.md). The full atlas-scale-pretrained 'LINGER' method is
# hardcoded to hg19/hg38 throughout preprocess.py/LL_net.py (hg19_hg38_pair.bed,
# RE_gene_corr_hg19.bed, etc.) — not usable for this project's mouse data.
#
# GRNdir must point at LINGER's own downloadable reference bundle (the
# "provide_data/" directory from their "Download the general gene regulatory
# network" doc step) — NOT something this pipeline builds. See SETUP.md.
# ---------------------------------------------------------------------------
linger:
  genome: mm10
  method: scNN
  activef: ReLU              # 'ReLU' | 'sigmoid' | 'tanh'
  tss_distance_bp: 200000    # max RE-to-TG distance considered
  # Real path, confirmed from setup_linger.sh Step 8's own summary output
  # ("GRNdir = ${PROVIDE_DATA_DIR}/provide_data") — NOT references/, and
  # note the doubled provide_data/provide_data (tarball extracted into a
  # dir of the same name).
  grn_dir: "/exports/eddie/scratch/s2906787/linger_pipeline/provide_data/provide_data"
  # Pre-built conda envs from setup_linger.sh — reused directly (full path
  # to the env's own directory, not a name) so Snakemake's --use-conda
  # does NOT try to rebuild them from envs/linger.yaml. Rebuilding risks
  # exactly the anndata/scipy version conflict setup_linger.sh's own
  # comments document hitting and fixing (Step 4's "WHY SO FEW PACKAGES"
  # note) — reusing the already-verified env avoids re-litigating that.
  # Confirmed 2026-07-25 via `conda env list` on Eddie — real paths are
  # under the group-managed bioinfmsc anaconda install, NOT
  # linger_pipeline/conda_envs/ as setup_linger.sh's ~/.condarc edit
  # intended. `module load anaconda` on Eddie loads this group install,
  # which took precedence — the personal envs_dirs redirect never applied.
  conda_env_linger: "/exports/csce/eddie/biology/groups/bioinfmsc/anaconda/envs/s2906787/LINGER"
  conda_env_tools:  "/exports/csce/eddie/biology/groups/bioinfmsc/anaconda/envs/s2906787/linger_tools"
  # HOMER is a standalone Perl install (setup_linger.sh Step 9), not a
  # conda package — call the binary directly rather than relying on PATH
  # inside a conda env (avoids collision with a conda-provided homer).
  homer_bin: "/exports/eddie/scratch/s2906787/linger_pipeline/homer/bin"
  use_gpu: false              # flip to true once GPU access on `gpu` queue is confirmed
  # perturbation_genes/perturbation_combos previously lived here as an
  # unconsumed placeholder (Module 8 didn't exist yet). REMOVED 2026-09-08
  # to avoid two competing specs — the real, consumed knockout config is
  # the top-level `perturbation.knockouts` block near the end of this
  # file, read directly by 08_perturbation.smk.

# ---------------------------------------------------------------------------
# Computational resources — single source of truth for SGE memory/slot/
# runtime tuning, read by sge_extra() in the Snakefile. Do not add
# `sge_pe: "sharedmem"` to any rule (see Snakefile docstring for why — the
# EDDIE profile runs with --cores 1, so sge_pe silently collapses every job
# to one slot; hardcode slots via sge_extra instead, exactly as the
# tRNA-seq pipeline's config_eddie.yaml does).
# ---------------------------------------------------------------------------
resources:

  qc_preprocess_sample:
    slots: 1
    vmem_mb: 32000        # Scrublet's randomized PCA/SVD is the memory-heavy step
    runtime_min: 120

  extract_peaks:
    slots: 1
    vmem_mb: 4000
    runtime_min: 30

  merge_consensus_peaks:
    slots: 1
    vmem_mb: 4000
    runtime_min: 30       # pure text sort/merge — lightweight, login-node safe

  requantify_consensus:
    slots: 4
    vmem_mb: 8000
    runtime_min: 240      # snapatac2 fragment import over full fragments.tsv.gz

  sync_rna_atac_barcodes:
    slots: 1
    vmem_mb: 8000
    runtime_min: 30

  sanity_checks:
    slots: 1
    vmem_mb: 16000
    runtime_min: 60

  integrate_harmony:
    slots: 4
    vmem_mb: 32000        # HVG selection + PCA + Harmony + neighbors/UMAP over all samples pooled
    runtime_min: 180

  score_markers:
    slots: 1
    vmem_mb: 8000
    runtime_min: 30

  apply_cell_type_labels:
    slots: 1
    vmem_mb: 8000
    runtime_min: 15

  linger_get_tss:
    slots: 1
    vmem_mb: 8000
    runtime_min: 30

  # Added 2026-07-25 — this rule was previously reusing linger_get_tss's
  # resources block (no entry of its own existed), which meant it inherited
  # runtime_min: 30. HOMER's annotatePeaks.pl -m over the full consensus
  # peak set x 1466 motifs genome-wide needs longer than that: qacct on the
  # actual failed run showed "failed 44: execd enforced h_rt limit" (SIGKILL
  # at exactly 30 min) while maxvmem was only ~2GB — memory was never the
  # constraint, only runtime. vmem_mb kept modest since usage was nowhere
  # near 8000M; runtime_min given generous headroom over the observed cutoff.
  #
  # vmem_mb raised 2026-09-03 (first pass) — with runtime no longer the
  # constraint, a real run got all the way to "Finding instances of 1466
  # motif(s)" (genome-wide motif matching, the memory-heavy phase) before
  # qacct showed "failed 46: execd enforced h_vmem limit", maxvmem 7.840G
  # against this 8000M cap — walltime was fine (ru_wallclock ~5h15m, under
  # the 6h runtime_min). Raised to 20000M for real headroom over the
  # observed 7.84G peak, same margin-over-observed-peak pattern used for
  # linger_prep_pseudobulk below.
  #
  # runtime_min raised 2026-09-03 (second pass) — with the OOM fixed, the
  # very next run hit a NEW wall: qacct showed "failed 44: execd enforced
  # h_rt limit" at ru_wallclock 21599.773s (killed at exactly the 360min
  # cap), maxvmem only 9.599G (no OOM this time — memory fix held). The
  # 04c_motif_scan.log tail showed the job still just past 0% into
  # "Finding instances of 1466 motif(s)" after the full 6h — i.e. genome-
  # wide motif matching across 224,626 sequences x 1466 motifs is just
  # slow, not stuck. Considered parallelizing via annotatePeaks.pl's -p
  # flag, but confirmed via `annotatePeaks.pl 2>&1 | grep -A2 "\-p "` that
  # -p is "nearest peaks" (a second peak file for distance annotation),
  # NOT a thread count — annotatePeaks.pl -m has no confirmed multithread
  # flag (unlike findMotifsGenome.pl's real -p). Raised runtime_min to
  # 2400 (40h) instead: `staging` queue's h_rt cap is 48:10:00 (qconf -sq
  # staging), so 40h leaves ~8h of margin under the hard ceiling while
  # giving genuine headroom over "barely past 0% at 6h". If this still
  # isn't enough, the real fix is sharding consensus_peaks.bed across
  # parallel annotatePeaks.pl processes (SGE array + merge step) rather
  # than pushing runtime_min further toward the queue's cap.
  #
  # vmem_mb raised again 2026-09-04 (third pass) — the 20000M cap held for
  # the OOM but the very next run (58047793, after runtime_min was already
  # fixed) hit ANOTHER h_vmem kill: qacct showed "failed 46: execd enforced
  # h_vmem limit" with maxvmem 19.922G against the 20000M cap, but this
  # time ru_wallclock was 51908.687s (~14h25m) and the 04c_motif_scan.log
  # progress bar was essentially fully filled (100% width) — i.e. memory
  # usage in this HOMER phase scales with how much motif-instance data has
  # accumulated over the run, not a fixed early-phase ceiling like the
  # first OOM suggested. Raised to 40000M (~2x the observed 19.922G peak)
  # for real margin over genuine completion-time usage rather than
  # early-phase usage. runtime_min unchanged — wallclock has never been
  # the actual bottleneck once memory was adequate (14h25m used of the
  # 2400min/40h budget).
  linger_motif_scan:
    slots: 8              # bumped 2026-09-06: rule already reads this via
                          # homer2 find -p {slots} (see 04_linger_init.smk)
                          # and passes it to SGE's -pe sharedmem via
                          # sge_extra() — no rule file change needed.
                          # No existing Module 4 precedent for this value
                          # (linger_get_tss/linger_prep_pseudobulk are both
                          # slots: 1) — chosen to match Module 6's
                          # linger_population_training scale given
                          # comparable workload size (224,626 sequences x
                          # 1,466 motifs), not measured against this rule
                          # specifically.
    vmem_mb: 48000        # was 40000; small precautionary bump for
                          # multi-threaded per-thread overhead, unmeasured
    runtime_min: 600      # was 2400 (40h); conservative ~4x reduction for
                          # 8 threads, not naive 8x — I/O and per-sequence
                          # overhead don't parallelize linearly. The one
                          # real data point (single-threaded run) doesn't
                          # tell us how this scales with -p 8; revisit
                          # after the first multi-threaded run actually
                          # completes.

  # Added 2026-07-25 — was reusing linger_get_tss's 8GB profile, which OOM'd.
  # Real failure: LingerGRN.pseudo_bulk.pseudo_bulk() densifies the pooled
  # ATAC matrix for sc.pp.scale() — 11639 cells x 41043 peaks x 8 bytes =
  # 3.56 GiB for that ONE array, plus several more dense copies around it
  # (RNA scaling, PCA workspace, .raw copies). 64GB is a generous margin
  # over the observed minimum, not a tight fit — cheap insurance against
  # hitting this same wall again on a slightly bigger intermediate.
  # Bumped 2026-07-25 (64GB -> 100GB) — qacct on the actual failed run showed
  # maxrss=24.095G / maxvmem=30.438G reached mid-step (during ATAC scaling,
  # before RNA scaling + neighbor graph + PCA even ran) before SGE's h_rss
  # enforcement killed it (see sge_extra() in Snakefile — h_rss wasn't being
  # requested at all until this same fix). 64GB was headroom over the
  # *originally estimated* single-array cost, not the real full-step peak.
  linger_prep_pseudobulk:
    slots: 1
    vmem_mb: 100000
    runtime_min: 120

  linger_population_training:
    slots: 8
    vmem_mb: 48000        # bumped 2026-09-05: real run hit maxvmem=30.9G
                          # against the old 32000M grant (96% utilized) —
                          # this isn't hypothetical, it nearly ran out.
                          # TF_RE_binding() adds another adata_RNA/adata_ATAC
                          # load on top of what training() already held, so
                          # give real headroom rather than a token bump.
    runtime_min: 1440     # was 600 (10h); RAISED 2026-09-10 after a real
                          # h_rt kill (job 58205500, qacct: "failed 44:
                          # execd enforced h_rt limit", ru_wallclock=36000s
                          # exactly). Real per-chromosome pace observed that
                          # run: 19/20 chromosomes done in ~596min (~31min/
                          # chr, no clear speedup/slowdown trend) ->
                          # extrapolates to ~630min for training() alone
                          # across all 20 chromosomes — already above the
                          # old 600min budget before TF_RE_binding()/
                          # cis_reg()/trans_reg() (all three still totally
                          # unmeasured, and now confirmed hard-required,
                          # not optional — see this script's own docstring)
                          # even start. 1440min (24h) gives ~2.3x margin
                          # over the ~630min training-only extrapolation,
                          # leaving real room for the unmeasured tail.
                          # Revisit with an actual number once a run
                          # completes end-to-end and qacct shows real
                          # ru_wallclock for the full job.

  linger_celltype_grn:
    slots: 4
    vmem_mb: 48000        # bumped 2026-09-05, same reasoning as
                          # linger_population_training: this rule reloads
                          # the full pooled RNA/ATAC cohort per array task
                          # (not just the one cell type it's computing),
                          # before subsetting internally — same memory
                          # profile as the rule that hit 30.9G/32000M.
                          # Hasn't actually run yet, so this is precautionary,
                          # not measured — watch qacct on the first task or
                          # two once it does run.
    runtime_min: 480     # was 360 (6h); bumped for the same margin-of-safety
                          # reasoning, unmeasured for this rule specifically

  # ---------------------------------------------------------------------
  # Modules 7-10 — added 2026-09-08. ALL runtime_min/vmem_mb values below
  # are FIRST-GUESS PLACEHOLDERS, not tuned against real output, following
  # this file's own established pattern (see linger_motif_scan/
  # linger_prep_pseudobulk above) of revising after the first real qacct
  # failure. Expect to raise linger_tf_activity_one's runtime in particular
  # once the first batch of 44 datasets shows which are large bulk RNA-seq
  # vs small sorted-population scRNA-seq.
  # ---------------------------------------------------------------------

  # --- Module 7 ---
  linger_tf_activity_one:
    slots: 1
    # Bumped 16000 -> 64000 2026-09-08 after GSE182202_P1_RNA's confirmed
    # real MemoryError (pandas hashtable resize inside
    # adata.var_names_make_unique(), triggered by a genuinely large
    # single-cell-resolution mtx — 264MB compressed matrix.mtx.gz). No real
    # qacct/maxvmem measurement exists for this failure (it OOM'd inside
    # Python before SGE's own accounting captured a clean peak) — 64000 is
    # a first-guess 4x bump, unmeasured, following this file's own
    # established "bump conservatively, revisit after the next real
    # failure" convention (see linger_motif_scan/linger_prep_pseudobulk
    # above). Applies to ALL 42 entries under this rule, not just
    # GSE182202_P1_RNA — this rule has one shared resource block, not a
    # per-entry_id one (unlike linger_perturbation_ko's per-ko_id params);
    # revisit if that turns out to matter for cost on the full batch.
    vmem_mb: 64000
    runtime_min: 60

  module7_aggregate:
    slots: 1
    vmem_mb: 4000
    runtime_min: 15

  # --- Module 8 ---
  prep_pseudobulk_target:
    slots: 1
    vmem_mb: 16000        # holds Target/Opn/Exp pseudobulk matrices in memory
    runtime_min: 30

  linger_perturbation_ko:
    slots: 1
    vmem_mb: 32000        # torch.load()'s one chromosome's netall dict at a
                          # time, not the whole genome at once — 32GB is
                          # headroom, not a measured requirement
    runtime_min: 240      # unmeasured — per-gene forward passes across all
                          # chromosomes, no training involved so should be
                          # much faster than linger_population_training's
                          # 4h+, but not benchmarked yet

  # Added 2026-09-18 — prep_pseudobulk_target_celltype (08b_perturbation_
  # celltype.smk) was reusing prep_pseudobulk_target's resources above
  # (16GB), but that rule only READS Module 4's already-written population
  # files, while prep_pseudobulk_target_celltype.py calls
  # LingerGRN.pseudo_bulk.pseudo_bulk() itself, on the full labeled.h5ad +
  # all 4 atac_consensus.h5ad, per its own docstring: "same pattern as
  # linger_prep_pseudobulk.py, not prep_pseudobulk_target.py". That's the
  # exact call already known to need 100GB (see linger_prep_pseudobulk
  # above, and its 2026-07-25 SIGKILL history). Confirmed the wrong-budget
  # bug for real: 19 of 20 array tasks were SIGKILLed with empty logs (no
  # Python traceback — the signature of a hard memory-limit kill, not a
  # code exception) under the borrowed 16GB cap; only Pericyte (192 cells,
  # the smallest single-cluster cell type) fit. Give this rule its own
  # entry, mirroring linger_prep_pseudobulk's, rather than reusing a
  # sibling's much lighter one.
  prep_pseudobulk_target_celltype:
    slots: 1
    vmem_mb: 100000
    runtime_min: 120

  # --- Module 9 ---
  validate_one:
    slots: 1
    vmem_mb: 16000
    runtime_min: 60

  module9_aggregate:
    slots: 1
    vmem_mb: 4000
    runtime_min: 15

  # --- Module 9b (ADDED 2026-09-19) ---
  # Same per-job workload as Module 9's validate_one (one held-out bulk
  # dataset loaded + scored against one knockout/aging-network prediction)
  # — reusing validate_one's budget as-is rather than guessing a different
  # number, since 09b_validation_celltype.smk's rules call the identical
  # validate_held_out.py script with the same per-call data volume, just a
  # different --module8-dir/--network value.
  validate_celltype_one:
    slots: 1
    vmem_mb: 16000
    runtime_min: 60

  # Same per-job workload as Module 9's module9_aggregate, scaled up for
  # more rows (population + up to 20 cell types x up to 5 checks each,
  # vs Module 9's 6 rows) and the added per-scope sanity_rho recomputation
  # (re-reading two already-small TSVs per scope, not re-running any
  # model) — still a light, pure-pandas job, generous headroom over
  # module9_aggregate's 4GB/15min rather than assumed identical.
  module9b_aggregate:
    slots: 1
    vmem_mb: 8000
    runtime_min: 30

  # --- Module 11 (CAPS) ---
  # caps_tf_activity — one TF_activity.regulon() call per (scope, ko_id or
  # baseline), same cost class as Module 7/9's own regulon() calls over a
  # single small predicted_expression.tsv (not a from-scratch GRN
  # computation) — matching validate_celltype_one's headroom rather than
  # linger_perturbation_ko's (no torch net loaded here).
  caps_tf_activity:
    slots: 1
    vmem_mb: 16000
    runtime_min: 60

  # caps_score — pure pandas: two small TF-indexed TSVs, one trans-
  # regulatory file, one already-aggregated validation report. Light job,
  # same headroom class as module9b_aggregate.
  caps_score:
    slots: 1
    vmem_mb: 8000
    runtime_min: 15

  # module11_aggregate — glob + concat of up to (1 + 20) x len(KNOCKOUTS)
  # small CAPS rows. Same light-job class as module9b_aggregate.
  module11_aggregate:
    slots: 1
    vmem_mb: 8000
    runtime_min: 30

  # --- Module 10 ---
  benchmark_grn_edges:
    slots: 1
    vmem_mb: 16000
    # runtime_min bumped 90 -> 360 on 2026-09-13: job was being killed by
    # the SGE wall-clock limit, not crashing in Python — confirmed via an
    # empty 10_benchmark.log and a .error file with no traceback, just the
    # Snakemake startup banner, plus a ~92min gap between job submission
    # and the reported failure (matching the old 90min runtime almost
    # exactly). The added GSE150391 split-prior (2 separate contexts) and
    # multi-file union-of-intervals logic from the 2026-09-11 fix round
    # added real per-celltype work across all 9 priors x 16 celltypes,
    # pushing actual runtime past the old ceiling.
    runtime_min: 360

# ---------------------------------------------------------------------------
# perturbation — Module 8. TF knockout sets, matching the HTML plan doc's
# Module 8 description exactly (reprogramming trio individually + combined,
# plus Tbx2). No overexpression entries — see 08_perturbation.smk header
# for why Module 9 doesn't need one.
# ---------------------------------------------------------------------------
perturbation:
  knockouts:
    atoh1_ko: ["Atoh1"]
    gfi1_ko: ["Gfi1"]
    pou4f3_ko: ["Pou4f3"]
    triple_ko: ["Atoh1", "Gfi1", "Pou4f3"]
    tbx2_ko: ["Tbx2"]
  # Module 8b (08b_perturbation_celltype.smk), added 2026-09-16.
  # enabled_celltypes: "all" runs every cell type from cluster_annotation.tsv
  # that clears min_cells_for_pseudobulk; set to an explicit list (e.g.
  # ["Hair cell", "Supporting cell"]) to restrict to specific cell types
  # instead. min_cells_for_pseudobulk is a judgment call, not a validated
  # number — 100 is a starting point, reconsider after looking at the real
  # per-cell-type sanity check results (small clusters like the ~41-cell
  # Macrophage-immune cell population from the 2026-09-13 run are exactly
  # the case this threshold exists to guard against).
  celltype_knockouts:
    enabled_celltypes: "all"
    min_cells_for_pseudobulk: 100
