# ---------------------------------------------------------------------------
# chromatin_prior_extra — Module 5. Reconciled against the ACTUAL disk layout
# under 02_chromatin_priors/, not the HTML plan doc, which had two errors:
#   - GSE150000 was described in the HTML as tuning-set RNA+ATAC data, but is
#     actually H3K4me3 mark data and lives under 02_chromatin_priors on disk
#     (GSE150000_P1SC_H3K4me3). Treated here as a chromatin prior.
#   - GSE288375 was labelled "ATAC" in the HTML's dataset table, but the
#     downloaded folder is GSE288375_ihc_ohc_rna (RNA), paired with
#     GSE288376_ihc_ohc_atac (ATAC) for the same IHC/OHC subtypes.
# NOTE (see README's "Module 5 open question"): LINGER's public API has no
# native ingestion path for Hi-C loops or CUT&RUN peaks as GRN-inference
# priors — only motif-based TF-RE binding (HOMER) and RE-TG genomic distance
# are used internally by method='scNN'. Hi-C/CUT&RUN are wired to Module 10
# (benchmarking ground truth) for now; using them as inference-time priors
# would need a bespoke change to LINGER's own training loop — see README.
# ---------------------------------------------------------------------------
chromatin_prior_extra:
  - prior_id: GSE305205_hic
    dataset: GSE305205
    role: hic_loops
    path: "{chrom_root}/GSE305205_hic"
  - prior_id: GSE150386_cutrun_atoh1
    dataset: GSE150386
    role: cutrun
    path: "{chrom_root}/GSE150386_cutrun_atoh1"
  # GSE150391_cutrun_pou4f3 split 2026-09-11 into two explicit ground-truth
  # contexts rather than one auto-detected file: the directory is the full
  # GEO series dump (70 files: ATAC/RNA/CUT&RUN across MEF reprogramming,
  # P1/E17/Merkel native tissue, multiple KO backgrounds) — picking
  # "alphabetically first *peak* match" was effectively random with respect
  # to biology. file_glob pins each to real GSM accessions, both reps
  # unioned as ground truth. Decided: keep BOTH as separate benchmark rows
  # (native vs. reprogrammed binding are different claims worth comparing
  # separately), rather than picking one.
  - prior_id: GSE150391_pou4f3_wt_hc
    dataset: GSE150391
    role: cutrun
    path: "{chrom_root}/GSE150391_cutrun_pou4f3"
    file_glob: "GSM454807[45]_E17HC_WT_POU4F3_CutnRun_rep*.narrowPeak.gz"
    # -> GSM4548074/75_E17HC_WT_POU4F3_CutnRun_rep{1,2}: endogenous POU4F3
    #    binding in wild-type E17 hair cells (the "native" ground truth).
  - prior_id: GSE150391_pou4f3_mef_reprogram
    dataset: GSE150391
    role: cutrun
    path: "{chrom_root}/GSE150391_cutrun_pou4f3"
    file_glob: "GSM454465[12]_MEF_Atoh1_Pou4f3_POU4F3_CutnRun_rep*.narrowPeak.gz"
    # -> GSM4544651/52_MEF_Atoh1_Pou4f3_POU4F3_CutnRun_rep{1,2}: POU4F3
    #    binding in MEFs during forced ATOH1+POU4F3 reprogramming — matches
    #    this pipeline's own atoh1_ko/pou4f3_ko/triple_ko perturbations.
  - prior_id: GSE181307_cutrun
    dataset: GSE181307
    role: skip
    skip_reason: >-
      2026-09-11 — directory contains only 3 bigWig signal tracks
      (P1_HC_Atoh1_EGFP_rep1/rep2/ctrl.bw), confirmed via `tar -tvf` on the
      RAW archive — no narrowPeak/BED peak calls were ever deposited in
      this GEO series. Not a download gap. Would need macs2 bdgpeakcall
      (or similar) run against the ctrl track as background to produce
      usable peaks — not attempted yet. Revisit if this prior is needed.
    path: "{chrom_root}/GSE181307_cutrun"
  - prior_id: GSE181310_atac
    dataset: GSE181310
    role: atac_prior
    path: "{chrom_root}/GSE181310_atac"
  - prior_id: GSE288375_ihc_ohc_rna
    dataset: GSE288375
    role: subtype_rna              # corrected from "ATAC" in the HTML table
    path: "{chrom_root}/GSE288375_ihc_ohc_rna"
  - prior_id: GSE288376_ihc_ohc_atac
    dataset: GSE288376
    role: subtype_atac
    path: "{chrom_root}/GSE288376_ihc_ohc_atac"
  - prior_id: GSE150000_P1SC_H3K4me3
    dataset: GSE150000
    role: h3k4me3                  # reclassified from HTML's "tuning" role
    path: "{chrom_root}/GSE150000_P1SC_H3K4me3"

