  # GSE203228/GSE154833 elsewhere in this file. Old loader silently used
  # the fpkm file ('f' < 'r' alphabetically); pinned explicitly here via
  # the newly-added glob_pattern override to preserve that exact prior
  # behavior rather than switching units. Not yet condition-split — this
  # dataset was never flagged for condition-mixing by the audit, but that
  # audit ran against the same silently-picked fpkm file, so if it also
  # blends multiple real conditions this hasn't been checked. Revisit if
  # this dataset's real column names turn out to need a split too.
  - sample_id: GSE329565
    dataset: GSE329565
    path: "{multiome_root}/../04_bulk_rnaseq/GSE329565"
    glob_pattern: "*fpkm_All_Samples.csv.gz"
  # EXCLUDED 2026-09-08 — discovered during Module 7 regression
  # verification. Confirmed real shape: 6 sibling per-sample files with a
  # header (ProbeName, "[W<n>](raw)"), but "ProbeName" values (e.g.
  # A_55_P2280868) are Agilent SurePrint MICROARRAY probe IDs, not gene
  # identifiers — this is microarray intensity data, not RNA-seq counts.
  # Fixing the loader wouldn't fix this: TF_activity.regulon() intersects
  # RNA.index against trans_reg.index (gene symbols/Ensembl IDs) — probe
  # IDs would produce an EMPTY overlap and either crash or silently return
  # a meaningless degenerate result, not a loud error. Needs an external
  # Agilent probe->gene annotation file this pipeline doesn't currently
  # source (same category of gap as GSE266157's missing transcript->gene
  # map) before this can be used at all.
  # - sample_id: GSE83599
  #   dataset: GSE83599
  #   path: "{multiome_root}/../04_bulk_rnaseq/GSE83599"
  # FIXED 2026-09-26 (Bug Class A, on top of the pre-existing symbol_column/
  # exclude_columns fixes below) — WTF (3 reps) vs HETF (3 reps) were one
  # blended mean; split by genotype. Both keep the existing symbol_column/
  # exclude_columns fixes.
  - sample_id: GSE85519_WTF
    dataset: GSE85519
    path: "{multiome_root}/../04_bulk_rnaseq/GSE85519"
    sample_column_regex: "^WTF\\d$"
    symbol_column: sym
    exclude_columns: [chr]
  - sample_id: GSE85519_HETF
    dataset: GSE85519
    path: "{multiome_root}/../04_bulk_rnaseq/GSE85519"
    sample_column_regex: "^HETF\\d$"
    symbol_column: sym
    exclude_columns: [chr]
  # FIXED 2026-09-26 (Bug Class A + Bug Class C together) — real columns
  # confirmed via obs_names audit: 8 DE-statistics columns (MVA:*/EDGE:*/
  # SAM:* — all colon-separated, describing the WT-vs-KO contrast itself,
  # not a sample) plus WT-1/2/3, KO-1/2/3 (real per-replicate values) and
  # WT-1 reads/KO-1 reads/etc (raw read-count duplicates of the same
  # replicates, not additional samples) — 28 columns total, previously ALL
  # numeric-coerced and averaged into one blended WT+KO+stats mean. A tight
  # exact-match regex both splits WT from KO (Bug Class A) and excludes
  # every stats/reads column in one step (Bug Class C), since none of them
  # match "^WT-\d+$"/"^KO-\d+$" — no separate exclude_columns needed.
  - sample_id: GSE90821_WT
    dataset: GSE90821
    path: "{multiome_root}/../04_bulk_rnaseq/GSE90821"
    sample_column_regex: "^WT-\\d+$"
  - sample_id: GSE90821_KO
    dataset: GSE90821
    path: "{multiome_root}/../04_bulk_rnaseq/GSE90821"
    sample_column_regex: "^KO-\\d+$"

