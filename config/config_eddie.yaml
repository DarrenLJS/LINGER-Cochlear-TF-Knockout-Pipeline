# =============================================================================
# config/config_eddie.yaml
# Single source of truth for paths, sample manifest, and SGE resources.
#
# This is sample_config.py's SAMPLES / EXTRA_* / QC_PARAMS, ported to YAML so
# the Snakefile can build the DAG from it directly, plus a `resources:` block
# following the same pattern as the tRNA-seq pipeline's config_eddie.yaml
# (sge_extra() helper in the Snakefile reads it — see Snakefile docstring).
# =============================================================================

# ---------------------------------------------------------------------------
# Core paths
# ---------------------------------------------------------------------------
multiome_root: "/exports/eddie/scratch/s2906787/cochlear_datasets/01_multiome"
chrom_root:    "/exports/eddie/scratch/s2906787/cochlear_datasets/02_chromatin_priors"
scratch:       "/exports/eddie/scratch/s2906787/linger_pipeline/preprocessed"

references:
  mm10_chrom_sizes: "/exports/eddie/scratch/s2906787/linger_pipeline/references/mm10/mm10.chrom.sizes"

# ---------------------------------------------------------------------------
# SAMPLES — paired multiome, Module 1/2's main path.
# One entry per sample_id. `type` selects the loader in
# workflow/scripts/qc_lib.py (h5_combined / mtx_combined / mtx_separate).
#
# GSE182202_P1 is excluded — its ATAC fragments file (GSM6883296) was
# confirmed to be a mislabeled duplicate of GSE182202_P8's fragments
# (GSM6883298), 4996/4996 barcodes identical. RNA (GSM6883295) is genuinely
# independent and is rerouted to extra_bulk_rna_inputs below.
# GSE224563_P8 (GSM7026050) is excluded — its ATAC fragments file was
# confirmed byte-identical (md5sum) to GSE182202_P8's. Kept as GSE182202_P8
# only, to avoid double-counting one biological sample in Module 3.
# ---------------------------------------------------------------------------
samples:
  - sample_id: GSE182202_P8
    dataset: GSE182202
    type: mtx_combined
    combined_prefix: "{multiome_root}/GSE182202/GSM6883297_P8_cochlea_wildtype_10x_scRNA_scATAC_filtered_feature_bc_matrix_"
    atac_fragments:  "{multiome_root}/GSE182202/GSM6883298_P8_cochlea_wildtype_10x_scRNA_scATAC_atac_fragments.tsv.gz"
    # Manual override — automatic Scrublet thresholding reproduced two wildly
    # different results across reruns of this exact input (38.6% vs ~0%
    # doublets). 0.05 read off doublet_scores.png: the singlet peak for this
    # sample sits almost entirely below ~0.04-0.05. Cross-checked in the
    # 2026-07-21 sanity-check pass: manual threshold (38.17%) converged with
    # the original automatic run (38.6%), independently — treated as the
    # sample's real doublet rate, not thresholding noise. See doublet_scores.png
    # caveat in qc_lib.py before re-litigating this number.
    scrublet_manual_threshold: 0.05

  - sample_id: GSE224563_P1
    dataset: GSE224563
    type: h5_combined
    h5_path:        "{multiome_root}/GSE224563/GSM7026046_P1_wildtype_10x_scRNA_scATAC_filtered_feature_bc_matrix.h5"
    atac_fragments:  "{multiome_root}/GSE224563/GSM7026047_P1_wildtype_10x_scRNA_scATAC_atac_fragments.tsv.gz"

  - sample_id: GSE224563_P70_wildtype
    dataset: GSE224563
    type: h5_combined
    h5_path:        "{multiome_root}/GSE224563/GSM7026050_P70_cochlea_wildtype_10x_scRNA_scATAC_filtered_feature_bc_matrix.h5"
    atac_fragments:  "{multiome_root}/GSE224563/GSM7026051_P70_cochlea_wildtype_10x_scRNA_scATAC_atac_fragments.tsv.gz"

  - sample_id: GSE224563_P70_deafened
    dataset: GSE224563
    type: h5_combined
    h5_path:        "{multiome_root}/GSE224563/GSM7026052_P70_cochlea_deafened_10x_scRNA_scATAC_filtered_feature_bc_matrix.h5"
    atac_fragments:  "{multiome_root}/GSE224563/GSM7026053_P70_cochlea_deafened_10x_scRNA_scATAC_atac_fragments.tsv.gz"

  # EXCLUDED 2026-09-27 — GSE331301 is downloaded by download_datasets.sh's
  # Section 1 ("single-cell multiome") but was never added here. Confirmed
  # via other_helper_scripts/geo_lookup_full.py Stage A (real NCBI eutils
  # metadata, not a folder-name guess): "Distal Enhancer-Insulator Module of
  # GDF6 is Essential for Cochlear Formation [single-cell multiome]" —
  # taxon Homo sapiens, n_samples=4. This pipeline is mouse-only by design:
  # `linger.method: scNN` was chosen specifically because LINGER's other
  # method is hardcoded to human hg19/hg38 and confirmed structurally
  # incompatible with this project's mouse data (see the `linger:` block's
  # own comment below). A human dataset cannot be folded into the mm10
  # `samples:` DAG regardless of how well-matched its cell content looks —
  # do not re-add without a real plan for cross-species handling first.

# ---------------------------------------------------------------------------
# EXTRA_BULK_RNA_INPUTS — rerouted RNA, not part of the paired-multiome DAG.
# Consumed by Module 7 (bulk TF activity), not Modules 1-3.
#
# Backfilled 2026-07-24 from 3 -> 38 entries: the 3 original samples, plus
# all 34 accessions in download_datasets.sh's BULK_ACCESSIONS array, plus
# GSE150002_P1SC_reprogramming (reclassified here — script comment called it
# "notch_dapt" tuning data, but it's actually bulk RNA and lives under
# 04_bulk_rnaseq on disk, not 05_tuning_validation).
# `path` points at the raw download folder — the actual RNA count-matrix
# filenames vary per GSE and need per-dataset loader logic in Module 7's
# script (same three-loader pattern as qc_lib.py's LOADERS dict), not a
# fixed rna_prefix the way the paired-multiome samples above have.
# ---------------------------------------------------------------------------
extra_bulk_rna_inputs:
  - sample_id: GSE182202_P1_RNA
    dataset: GSE182202
    rna_prefix: "{multiome_root}/GSE182202/GSM6883295_P1_cochlea_wildtype_10x_scRNA_scATAC_filtered_feature_bc_matrix_"
    region: P1
  - sample_id: GSE157398_Apex_RNA
    dataset: GSE157398
    rna_prefix: "{multiome_root}/GSE157398/GSM4764088_Cochlear_scRNAseq_Apex_"
    region: Apex
  - sample_id: GSE157398_Base_RNA
    dataset: GSE157398
    rna_prefix: "{multiome_root}/GSE157398/GSM4764089_Cochlear_scRNAseq_Base_"
    region: Base
  # FIXED 2026-09-26 (Bug Class A) — this single entry loaded all 14 real
  # sibling files (5 distinct treatment/timepoint conditions: DMSO_24h,
  # DAPT_24h, control_48h, nonpermissive_48h, permissive_48h) into one
  # AnnData, which linger_tf_activity.py then collapses to ONE row via
  # score.mean(axis=1) — blending 5 real conditions into a single TF
  # activity value. Split into 5 entries, one per real condition,
  # glob_pattern-restricted to that condition's own sibling files only
  # (confirmed real filenames via config_multiplicity check).
  - sample_id: GSE150002_DMSO_24h
    dataset: GSE150002
    path: "{multiome_root}/../04_bulk_rnaseq/GSE150002_P1SC_reprogramming"
    format: per_sample_merge
    glob_pattern: "*_P1SC_DMSO_24h_RNAseq_*.genes.results.txt.gz"
    value_column: expected_count
    id_column: gene_id
    sample_name_regex: "^GSM\\d+_(.+)\\.genes\\.results\\.txt\\.gz$"
  - sample_id: GSE150002_DAPT_24h
    dataset: GSE150002
    path: "{multiome_root}/../04_bulk_rnaseq/GSE150002_P1SC_reprogramming"
    format: per_sample_merge
    glob_pattern: "*_P1SC_DAPT_24h_RNAseq_*.genes.results.txt.gz"
    value_column: expected_count
    id_column: gene_id
    sample_name_regex: "^GSM\\d+_(.+)\\.genes\\.results\\.txt\\.gz$"
  - sample_id: GSE150002_control_48h
    dataset: GSE150002
    path: "{multiome_root}/../04_bulk_rnaseq/GSE150002_P1SC_reprogramming"
    format: per_sample_merge
    glob_pattern: "*_P1SC_control_48h_RNAseq_*.genes.results.txt.gz"
    value_column: expected_count
    id_column: gene_id
    sample_name_regex: "^GSM\\d+_(.+)\\.genes\\.results\\.txt\\.gz$"
  - sample_id: GSE150002_nonpermissive_48h
    dataset: GSE150002
    path: "{multiome_root}/../04_bulk_rnaseq/GSE150002_P1SC_reprogramming"
    format: per_sample_merge
    glob_pattern: "*_P1SC_nonpermissive_48h_RNAseq_*.genes.results.txt.gz"
    value_column: expected_count
    id_column: gene_id
    sample_name_regex: "^GSM\\d+_(.+)\\.genes\\.results\\.txt\\.gz$"
  - sample_id: GSE150002_permissive_48h
    dataset: GSE150002
    path: "{multiome_root}/../04_bulk_rnaseq/GSE150002_P1SC_reprogramming"
    format: per_sample_merge
    # "nonpermissive_48h" does NOT match this pattern — the substring
    # "_P1SC_permissive_" is not present inside "_P1SC_nonpermissive_",
    # confirmed by direct string check before relying on it.
    glob_pattern: "*_P1SC_permissive_48h_RNAseq_*.genes.results.txt.gz"
    value_column: expected_count
    id_column: gene_id
    sample_name_regex: "^GSM\\d+_(.+)\\.genes\\.results\\.txt\\.gz$"
  # FIXED 2026-09-26 (Bug Class A) — real columns confirmed: R4con1/2/4/5,
  # R4FK2/3/4/5, WTcon1-4, WTFK1/2/4/7 (16 total, 4 genotype x condition
  # groups of 4 replicates each) all loaded as one matrix, blended into one
  # mean. Split via sample_column_regex, one entry per real group.
