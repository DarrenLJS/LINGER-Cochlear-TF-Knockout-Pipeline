# ---------------------------------------------------------------------------
# Module 4-8 — LINGER core (GRN inference, TF activity, perturbation)
#
# method='scNN' — chosen because it's the ONLY LINGER training mode that
# supports mouse natively (confirmed against installed LingerGRN==1.110
# source, docs/scNN.md). The full atlas-scale-pretrained 'LINGER' method is
# hardcoded to hg19/hg38 throughout preprocess.py/LL_net.py (hg19_hg38_pair.bed,
# RE_gene_corr_hg19.bed, etc.) — not usable for this project's mouse data.
#
# GRNdir must point at LINGER's own downloadable reference bundle (the
# "provide_data/" directory from their "Download the general gene regulatory
# network" doc step) — NOT something this pipeline builds. See SETUP.md.
# ---------------------------------------------------------------------------
linger:
  genome: mm10
  method: scNN
  activef: ReLU              # 'ReLU' | 'sigmoid' | 'tanh'
  tss_distance_bp: 200000    # max RE-to-TG distance considered
  # Real path, confirmed from setup_linger.sh Step 8's own summary output
  # ("GRNdir = ${PROVIDE_DATA_DIR}/provide_data") — NOT references/, and
  # note the doubled provide_data/provide_data (tarball extracted into a
  # dir of the same name).
  grn_dir: "/exports/eddie/scratch/s2906787/linger_pipeline/provide_data/provide_data"
  # Pre-built conda envs from setup_linger.sh — reused directly (full path
  # to the env's own directory, not a name) so Snakemake's --use-conda
  # does NOT try to rebuild them from envs/linger.yaml. Rebuilding risks
  # exactly the anndata/scipy version conflict setup_linger.sh's own
  # comments document hitting and fixing (Step 4's "WHY SO FEW PACKAGES"
  # note) — reusing the already-verified env avoids re-litigating that.
  # Confirmed 2026-07-25 via `conda env list` on Eddie — real paths are
  # under the group-managed bioinfmsc anaconda install, NOT
  # linger_pipeline/conda_envs/ as setup_linger.sh's ~/.condarc edit
  # intended. `module load anaconda` on Eddie loads this group install,
  # which took precedence — the personal envs_dirs redirect never applied.
  conda_env_linger: "/exports/csce/eddie/biology/groups/bioinfmsc/anaconda/envs/s2906787/LINGER"
  conda_env_tools:  "/exports/csce/eddie/biology/groups/bioinfmsc/anaconda/envs/s2906787/linger_tools"
  # HOMER is a standalone Perl install (setup_linger.sh Step 9), not a
  # conda package — call the binary directly rather than relying on PATH
  # inside a conda env (avoids collision with a conda-provided homer).
  homer_bin: "/exports/eddie/scratch/s2906787/linger_pipeline/homer/bin"
  use_gpu: false              # flip to true once GPU access on `gpu` queue is confirmed
  # perturbation_genes/perturbation_combos previously lived here as an
  # unconsumed placeholder (Module 8 didn't exist yet). REMOVED 2026-09-08
  # to avoid two competing specs — the real, consumed knockout config is
  # the top-level `perturbation.knockouts` block near the end of this
  # file, read directly by 08_perturbation.smk.

# ---------------------------------------------------------------------------
# Computational resources — single source of truth for SGE memory/slot/
# runtime tuning, read by sge_extra() in the Snakefile. Do not add
# `sge_pe: "sharedmem"` to any rule (see Snakefile docstring for why — the
# EDDIE profile runs with --cores 1, so sge_pe silently collapses every job
# to one slot; hardcode slots via sge_extra instead, exactly as the
# tRNA-seq pipeline's config_eddie.yaml does).
# ---------------------------------------------------------------------------
resources:

  qc_preprocess_sample:
    slots: 1
    vmem_mb: 32000        # Scrublet's randomized PCA/SVD is the memory-heavy step
    runtime_min: 120

  extract_peaks:
    slots: 1
    vmem_mb: 4000
    runtime_min: 30

  merge_consensus_peaks:
    slots: 1
    vmem_mb: 4000
    runtime_min: 30       # pure text sort/merge — lightweight, login-node safe

  requantify_consensus:
    slots: 4
    vmem_mb: 8000
    runtime_min: 240      # snapatac2 fragment import over full fragments.tsv.gz

  sync_rna_atac_barcodes:
    slots: 1
    vmem_mb: 8000
    runtime_min: 30

  sanity_checks:
    slots: 1
    vmem_mb: 16000
    runtime_min: 60

  integrate_harmony:
    slots: 4
    vmem_mb: 32000        # HVG selection + PCA + Harmony + neighbors/UMAP over all samples pooled
    runtime_min: 180

  score_markers:
    slots: 1
    vmem_mb: 8000
    runtime_min: 30

  apply_cell_type_labels:
    slots: 1
    vmem_mb: 8000
    runtime_min: 15

  linger_get_tss:
    slots: 1
    vmem_mb: 8000
    runtime_min: 30

  # Added 2026-07-25 — this rule was previously reusing linger_get_tss's
  # resources block (no entry of its own existed), which meant it inherited
  # runtime_min: 30. HOMER's annotatePeaks.pl -m over the full consensus
  # peak set x 1466 motifs genome-wide needs longer than that: qacct on the
  # actual failed run showed "failed 44: execd enforced h_rt limit" (SIGKILL
  # at exactly 30 min) while maxvmem was only ~2GB — memory was never the
  # constraint, only runtime. vmem_mb kept modest since usage was nowhere
  # near 8000M; runtime_min given generous headroom over the observed cutoff.
  #
  # vmem_mb raised 2026-09-03 (first pass) — with runtime no longer the
  # constraint, a real run got all the way to "Finding instances of 1466
  # motif(s)" (genome-wide motif matching, the memory-heavy phase) before
  # qacct showed "failed 46: execd enforced h_vmem limit", maxvmem 7.840G
  # against this 8000M cap — walltime was fine (ru_wallclock ~5h15m, under
  # the 6h runtime_min). Raised to 20000M for real headroom over the
  # observed 7.84G peak, same margin-over-observed-peak pattern used for
  # linger_prep_pseudobulk below.
  #
  # runtime_min raised 2026-09-03 (second pass) — with the OOM fixed, the
  # very next run hit a NEW wall: qacct showed "failed 44: execd enforced
  # h_rt limit" at ru_wallclock 21599.773s (killed at exactly the 360min
  # cap), maxvmem only 9.599G (no OOM this time — memory fix held). The
  # 04c_motif_scan.log tail showed the job still just past 0% into
  # "Finding instances of 1466 motif(s)" after the full 6h — i.e. genome-
  # wide motif matching across 224,626 sequences x 1466 motifs is just
  # slow, not stuck. Considered parallelizing via annotatePeaks.pl's -p
  # flag, but confirmed via `annotatePeaks.pl 2>&1 | grep -A2 "\-p "` that
  # -p is "nearest peaks" (a second peak file for distance annotation),
  # NOT a thread count — annotatePeaks.pl -m has no confirmed multithread
  # flag (unlike findMotifsGenome.pl's real -p). Raised runtime_min to
  # 2400 (40h) instead: `staging` queue's h_rt cap is 48:10:00 (qconf -sq
  # staging), so 40h leaves ~8h of margin under the hard ceiling while
  # giving genuine headroom over "barely past 0% at 6h". If this still
  # isn't enough, the real fix is sharding consensus_peaks.bed across
  # parallel annotatePeaks.pl processes (SGE array + merge step) rather
  # than pushing runtime_min further toward the queue's cap.
  #
  # vmem_mb raised again 2026-09-04 (third pass) — the 20000M cap held for
  # the OOM but the very next run (58047793, after runtime_min was already
  # fixed) hit ANOTHER h_vmem kill: qacct showed "failed 46: execd enforced
  # h_vmem limit" with maxvmem 19.922G against the 20000M cap, but this
  # time ru_wallclock was 51908.687s (~14h25m) and the 04c_motif_scan.log
  # progress bar was essentially fully filled (100% width) — i.e. memory
  # usage in this HOMER phase scales with how much motif-instance data has
  # accumulated over the run, not a fixed early-phase ceiling like the
  # first OOM suggested. Raised to 40000M (~2x the observed 19.922G peak)
  # for real margin over genuine completion-time usage rather than
  # early-phase usage. runtime_min unchanged — wallclock has never been
  # the actual bottleneck once memory was adequate (14h25m used of the
  # 2400min/40h budget).
  linger_motif_scan:
    slots: 8              # bumped 2026-09-06: rule already reads this via
                          # homer2 find -p {slots} (see 04_linger_init.smk)
                          # and passes it to SGE's -pe sharedmem via
                          # sge_extra() — no rule file change needed.
                          # No existing Module 4 precedent for this value
                          # (linger_get_tss/linger_prep_pseudobulk are both
                          # slots: 1) — chosen to match Module 6's
                          # linger_population_training scale given
                          # comparable workload size (224,626 sequences x
                          # 1,466 motifs), not measured against this rule
                          # specifically.
    vmem_mb: 48000        # was 40000; small precautionary bump for
                          # multi-threaded per-thread overhead, unmeasured
    runtime_min: 600      # was 2400 (40h); conservative ~4x reduction for
                          # 8 threads, not naive 8x — I/O and per-sequence
                          # overhead don't parallelize linearly. The one
                          # real data point (single-threaded run) doesn't
                          # tell us how this scales with -p 8; revisit
                          # after the first multi-threaded run actually
                          # completes.

  # Added 2026-07-25 — was reusing linger_get_tss's 8GB profile, which OOM'd.
  # Real failure: LingerGRN.pseudo_bulk.pseudo_bulk() densifies the pooled
  # ATAC matrix for sc.pp.scale() — 11639 cells x 41043 peaks x 8 bytes =
  # 3.56 GiB for that ONE array, plus several more dense copies around it
  # (RNA scaling, PCA workspace, .raw copies). 64GB is a generous margin
  # over the observed minimum, not a tight fit — cheap insurance against
  # hitting this same wall again on a slightly bigger intermediate.
  # Bumped 2026-07-25 (64GB -> 100GB) — qacct on the actual failed run showed
  # maxrss=24.095G / maxvmem=30.438G reached mid-step (during ATAC scaling,
  # before RNA scaling + neighbor graph + PCA even ran) before SGE's h_rss
  # enforcement killed it (see sge_extra() in Snakefile — h_rss wasn't being
  # requested at all until this same fix). 64GB was headroom over the
  # *originally estimated* single-array cost, not the real full-step peak.
  linger_prep_pseudobulk:
    slots: 1
    vmem_mb: 100000
    runtime_min: 120

  linger_population_training:
    slots: 8
    vmem_mb: 48000        # bumped 2026-09-05: real run hit maxvmem=30.9G
                          # against the old 32000M grant (96% utilized) —
                          # this isn't hypothetical, it nearly ran out.
                          # TF_RE_binding() adds another adata_RNA/adata_ATAC
                          # load on top of what training() already held, so
                          # give real headroom rather than a token bump.
    runtime_min: 1440     # was 600 (10h); RAISED 2026-09-10 after a real
                          # h_rt kill (job 58205500, qacct: "failed 44:
                          # execd enforced h_rt limit", ru_wallclock=36000s
                          # exactly). Real per-chromosome pace observed that
                          # run: 19/20 chromosomes done in ~596min (~31min/
                          # chr, no clear speedup/slowdown trend) ->
                          # extrapolates to ~630min for training() alone
                          # across all 20 chromosomes — already above the
                          # old 600min budget before TF_RE_binding()/
                          # cis_reg()/trans_reg() (all three still totally
                          # unmeasured, and now confirmed hard-required,
                          # not optional — see this script's own docstring)
                          # even start. 1440min (24h) gives ~2.3x margin
                          # over the ~630min training-only extrapolation,
                          # leaving real room for the unmeasured tail.
                          # Revisit with an actual number once a run
                          # completes end-to-end and qacct shows real
                          # ru_wallclock for the full job.

  linger_celltype_grn:
    slots: 4
    vmem_mb: 48000        # bumped 2026-09-05, same reasoning as
                          # linger_population_training: this rule reloads
                          # the full pooled RNA/ATAC cohort per array task
                          # (not just the one cell type it's computing),
                          # before subsetting internally — same memory
                          # profile as the rule that hit 30.9G/32000M.
                          # Hasn't actually run yet, so this is precautionary,
                          # not measured — watch qacct on the first task or
                          # two once it does run.
    runtime_min: 480     # was 360 (6h); bumped for the same margin-of-safety
                          # reasoning, unmeasured for this rule specifically

  # ---------------------------------------------------------------------
  # Modules 7-10 — added 2026-09-08. ALL runtime_min/vmem_mb values below
  # are FIRST-GUESS PLACEHOLDERS, not tuned against real output, following
  # this file's own established pattern (see linger_motif_scan/
  # linger_prep_pseudobulk above) of revising after the first real qacct
  # failure. Expect to raise linger_tf_activity_one's runtime in particular
  # once the first batch of 44 datasets shows which are large bulk RNA-seq
  # vs small sorted-population scRNA-seq.
  # ---------------------------------------------------------------------

  # --- Module 7 ---
  linger_tf_activity_one:
    slots: 1
    # Bumped 16000 -> 64000 2026-09-08 after GSE182202_P1_RNA's confirmed
    # real MemoryError (pandas hashtable resize inside
    # adata.var_names_make_unique(), triggered by a genuinely large
    # single-cell-resolution mtx — 264MB compressed matrix.mtx.gz). No real
    # qacct/maxvmem measurement exists for this failure (it OOM'd inside
    # Python before SGE's own accounting captured a clean peak) — 64000 is
    # a first-guess 4x bump, unmeasured, following this file's own
    # established "bump conservatively, revisit after the next real
    # failure" convention (see linger_motif_scan/linger_prep_pseudobulk
    # above). Applies to ALL 42 entries under this rule, not just
    # GSE182202_P1_RNA — this rule has one shared resource block, not a
    # per-entry_id one (unlike linger_perturbation_ko's per-ko_id params);
    # revisit if that turns out to matter for cost on the full batch.
    vmem_mb: 64000
    runtime_min: 60

  module7_aggregate:
    slots: 1
    vmem_mb: 4000
    runtime_min: 15

  # --- Module 8 ---
  prep_pseudobulk_target:
    slots: 1
    vmem_mb: 16000        # holds Target/Opn/Exp pseudobulk matrices in memory
    runtime_min: 30

  linger_perturbation_ko:
    slots: 1
    vmem_mb: 32000        # torch.load()'s one chromosome's netall dict at a
                          # time, not the whole genome at once — 32GB is
                          # headroom, not a measured requirement
    runtime_min: 240      # unmeasured — per-gene forward passes across all
                          # chromosomes, no training involved so should be
                          # much faster than linger_population_training's
                          # 4h+, but not benchmarked yet

  # --- Module 9 ---
  validate_one:
    slots: 1
    vmem_mb: 16000
    runtime_min: 60

  module9_aggregate:
    slots: 1
    vmem_mb: 4000
    runtime_min: 15

  # --- Module 10 ---
  benchmark_grn_edges:
    slots: 1
    vmem_mb: 16000
    runtime_min: 90

