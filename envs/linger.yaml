# NOT USED BY ANY RULE as of 2026-07-24 — kept for reference only.
#
# Module 4/6 rules point `conda:` directly at your existing pre-built
# `LINGER` conda env (config["linger"]["conda_env_linger"], full path to
# the env directory) instead of building from this spec file. That env
# already has the exact working pins setup_linger.sh's own comments
# document arriving at through trial and error (scanpy==1.9.5,
# anndata==0.9.2, scipy==1.11.3, LingerGRN==1.105 --no-deps, rpy2 for
# LINGER's internal R calls) — rebuilding from a looser spec like the one
# below risks reintroducing exactly the anndata/scipy conflict that
# comment describes hitting.
#
# Left here as documentation of what the env needs to contain, in case the
# real env ever needs to be rebuilt from scratch.
# ---------------------------------------------------------------------------
name: linger
channels:
  - bioconda
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10.0
  - pip

  # ── Exact pins from setup_linger.sh's requirements_linger_core.txt ──────
  - pytorch
  - numpy=1.24.3
  - pandas=2.0.3
  - scipy=1.11.3
  - scikit-learn=1.3.0
  - scanpy=1.9.5
  - anndata=0.9.2
  - joblib=1.3.2
  - matplotlib=3.8.0
  - seaborn=0.13.0

  # ── R interop — LINGER calls R internally ────────────────────────────────
  - rpy2

  # ── bedtools/pybedtools via conda binary (see setup_linger.sh Step 4
  #    comment: LingerGRN==1.105 pins pybedtools==0.10.0, source-only on
  #    PyPI; conda's 0.12.0 binary is API-compatible, installed then
  #    LingerGRN goes in with --no-deps to skip the version check) ────────
  - bedtools
  - pybedtools

  - pip:
      - shap==0.42.0
      - statsmodels==0.14.1
      - umap-learn
      - leidenalg
      - python-igraph
      - LingerGRN==1.105       # --no-deps in the real install — see above
      # Added 2026-09-08 for Module 7's bulk_rna_loader.py Excel support
      # (GSE129533/GSE256069 real .xlsx; GSE262205 real binary .xls;
      # GSE271610 fake-.xls-labeled plain text, doesn't actually need
      # either but the loader tries Excel first regardless). Installed
      # live into the real env via `pip install openpyxl xlrd` — no
      # version pin needed, neither package constrains numpy/pandas/scipy
      # the way LingerGRN's own deps do (see WHY SO FEW PACKAGES note
      # above), so this doesn't reopen the anndata/scipy conflict that
      # note describes. openpyxl reads .xlsx (OOXML); xlrd is REQUIRED
      # separately for real binary .xls (OOXML-only openpyxl cannot open
      # legacy BIFF/OLE2 .xls — confirmed via GSE262205's real ImportError
      # before xlrd was added).
      - openpyxl
      - xlrd
      # Added 2026-09-09 — NOT a dependency of the pipeline's own
      # production code (bulk_rna_loader.py/linger_tf_activity.py never
      # import yaml). Needed by verify_loader_regression.py, the one-off
      # regression-check driver script used to validate this loader
      # rewrite against real Eddie data (parses config_eddie.yaml
      # directly, outside Snakemake, to replay the real rule's resolved
      # entries). Installed live via `pip install pyyaml`. Documented here
      # anyway since that script runs inside this same LINGER env and a
      # from-scratch rebuild should carry it too, even though it's a
      # verification-tooling need rather than a pipeline-runtime one.
      - pyyaml

